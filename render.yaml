services:
  - type: web
    name: 10rs-baithulmal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free

  - type: static_site
    name: 10rs-baithulmal-frontend
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    plan: free
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://10rs-baithulmal-api.onrender.com